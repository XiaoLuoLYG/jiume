<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">JiuMe personal distillation preview</title>
  <desc id="desc">A static product preview of JiuMe turning reviewed work into local memory and skills.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#f4f5f1"/>
  <text x="92" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#111827">From one task to a better local twin</text>
  <text x="92" y="154" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4b5563">Nothing durable is written until the user reviews it.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="92" y="220" width="286" height="280" rx="22" fill="#ffffff" stroke="#dbe2ea" filter="url(#shadow)"/>
    <text x="128" y="272" font-size="22" font-weight="700" fill="#111827">1. Work together</text>
    <text x="128" y="316" font-size="16" fill="#4b5563">Chat, tasks, files, and tool</text>
    <text x="128" y="340" font-size="16" fill="#4b5563">results stay local first.</text>
    <rect x="128" y="386" width="190" height="18" rx="9" fill="#dbeafe"/>
    <rect x="128" y="424" width="150" height="18" rx="9" fill="#ccfbf1"/>

    <rect x="498" y="220" width="286" height="280" rx="22" fill="#ffffff" stroke="#dbe2ea" filter="url(#shadow)"/>
    <text x="534" y="272" font-size="22" font-weight="700" fill="#111827">2. Review changes</text>
    <text x="534" y="316" font-size="16" fill="#4b5563">Approve memories, style,</text>
    <text x="534" y="340" font-size="16" fill="#4b5563">or personal skill drafts.</text>
    <rect x="534" y="386" width="120" height="42" rx="21" fill="#111827"/>
    <text x="568" y="413" font-size="15" font-weight="700" fill="#ffffff">Approve</text>
    <rect x="666" y="386" width="82" height="42" rx="21" fill="#eef2f7"/>
    <text x="688" y="413" font-size="15" font-weight="700" fill="#374151">Skip</text>

    <rect x="904" y="220" width="286" height="280" rx="22" fill="#ffffff" stroke="#dbe2ea" filter="url(#shadow)"/>
    <text x="940" y="272" font-size="22" font-weight="700" fill="#111827">3. Improve twin</text>
    <text x="940" y="316" font-size="16" fill="#4b5563">Profile, memory, skills,</text>
    <text x="940" y="340" font-size="16" fill="#4b5563">and audit log update.</text>
    <circle cx="984" cy="414" r="26" fill="#ffdc82"/>
    <path d="M973 414 q11 14 23 0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <rect x="1030" y="392" width="108" height="44" rx="22" fill="#dcfce7"/>
    <text x="1054" y="420" font-size="15" font-weight="700" fill="#166534">Local</text>
  </g>

  <path d="M402 360 H474" fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
  <path d="M462 348 L476 360 L462 372" fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M808 360 H880" fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
  <path d="M868 348 L882 360 L868 372" fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
