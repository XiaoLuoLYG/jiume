<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">JiuMe desktop preview</title>
  <desc id="desc">A static product preview of the JiuMe avatar-first desktop surface.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf7f6"/>
      <stop offset="1" stop-color="#f7f2e8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#wall)"/>
  <rect x="88" y="86" width="1104" height="548" rx="28" fill="#f9fafb" stroke="#d6dee6"/>
  <rect x="88" y="86" width="1104" height="44" rx="28" fill="#1f2937"/>
  <text x="126" y="114" font-family="Inter, Arial, sans-serif" font-size="15" fill="#f9fafb">Desktop</text>
  <rect x="136" y="180" width="300" height="344" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="164" y="222" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">A quiet daily surface</text>
  <text x="164" y="258" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4b5563">JiuMe stays small until you need it.</text>
  <rect x="164" y="302" width="224" height="18" rx="9" fill="#dbeafe"/>
  <rect x="164" y="340" width="184" height="18" rx="9" fill="#ccfbf1"/>
  <rect x="164" y="378" width="246" height="18" rx="9" fill="#ffedd5"/>
  <rect x="164" y="440" width="142" height="42" rx="21" fill="#111827"/>
  <text x="190" y="467" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Open setup</text>

  <g filter="url(#soft)">
    <circle cx="910" cy="324" r="116" fill="#ffdc82"/>
    <path d="M832 317 C846 246 973 246 988 317 C968 285 851 285 832 317 Z" fill="#2f3a4c"/>
    <circle cx="872" cy="336" r="11" fill="#111827"/>
    <circle cx="948" cy="336" r="11" fill="#111827"/>
    <path d="M870 384 Q910 419 950 384" fill="none" stroke="#111827" stroke-width="10" stroke-linecap="round"/>
    <circle cx="910" cy="324" r="118" fill="none" stroke="#ffffff" stroke-width="10"/>
  </g>

  <rect x="722" y="478" width="376" height="90" rx="28" fill="#ffffff" stroke="#dbe2ea" filter="url(#soft)"/>
  <text x="760" y="515" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Plan tomorrow's focus list</text>
  <text x="760" y="546" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4b5563">Click avatar, type one line, send.</text>
  <circle cx="1048" cy="523" r="24" fill="#2563eb"/>
  <path d="M1038 523 h18 M1050 513 l12 10 l-12 10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
