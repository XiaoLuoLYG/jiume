<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">JiuMe setup preview</title>
  <desc id="desc">A static product preview of the JiuMe first-run setup page.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf7"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1b2430" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#e8edf0"/>
  <rect x="80" y="64" width="1120" height="592" rx="26" fill="url(#screen)" filter="url(#shadow)"/>
  <rect x="80" y="64" width="1120" height="64" rx="26" fill="#111827"/>
  <circle cx="120" cy="96" r="7" fill="#ff6b6b"/>
  <circle cx="146" cy="96" r="7" fill="#ffd166"/>
  <circle cx="172" cy="96" r="7" fill="#4ecdc4"/>
  <text x="216" y="103" font-family="Inter, Arial, sans-serif" font-size="18" fill="#f9fafb">JiuMe Setup</text>

  <rect x="126" y="168" width="248" height="420" rx="18" fill="#ffffff" stroke="#dbe2ea"/>
  <text x="156" y="214" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Create your twin</text>
  <text x="156" y="250" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">Local profile, clear consent,</text>
  <text x="156" y="274" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">and a desktop avatar.</text>
  <circle cx="250" cy="374" r="74" fill="#ffdd8a"/>
  <circle cx="226" cy="358" r="8" fill="#1f2937"/>
  <circle cx="274" cy="358" r="8" fill="#1f2937"/>
  <path d="M223 399 Q250 422 279 399" fill="none" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/>
  <rect x="156" y="488" width="158" height="48" rx="24" fill="#2563eb"/>
  <text x="185" y="519" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Start JiuMe</text>

  <rect x="420" y="168" width="704" height="420" rx="18" fill="#ffffff" stroke="#dbe2ea"/>
  <text x="464" y="220" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">First-run checklist</text>
  <g font-family="Inter, Arial, sans-serif" font-size="17" fill="#111827">
    <rect x="464" y="262" width="616" height="58" rx="14" fill="#f2f7ff"/>
    <circle cx="493" cy="291" r="11" fill="#2563eb"/>
    <path d="M487 291 l5 5 l10 -13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="520" y="298">Name the twin and choose an avatar</text>

    <rect x="464" y="340" width="616" height="58" rx="14" fill="#f6f8fa"/>
    <circle cx="493" cy="369" r="11" fill="#14b8a6"/>
    <path d="M487 369 l5 5 l10 -13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="520" y="376">Connect local runtime and optional model keys</text>

    <rect x="464" y="418" width="616" height="58" rx="14" fill="#fff7ed"/>
    <circle cx="493" cy="447" r="11" fill="#f97316"/>
    <path d="M487 447 l5 5 l10 -13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="520" y="454">Review permissions before writing memories</text>

    <rect x="464" y="496" width="616" height="58" rx="14" fill="#f7fee7"/>
    <circle cx="493" cy="525" r="11" fill="#65a30d"/>
    <path d="M487 525 l5 5 l10 -13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="520" y="532">Launch the desktop twin</text>
  </g>
</svg>
